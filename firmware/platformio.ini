[platformio]
default_envs = esp32dev

; Firmware completo: lógica del techo y JSON por USB
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
build_flags = -Wall
build_src_filter = +<*> -<prueba/>
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    olikraus/U8g2@^2.36.2

; Etapa 1: prueba de cada componente desde el monitor serie
[env:prueba]
extends = env:esp32dev
build_src_filter = +<prueba/>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    olikraus/U8g2@^2.36.2

; Pruebas de la lógica en la PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
